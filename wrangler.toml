# Cloudflare Pages の設定 (デプロイは .github/workflows/deploy.yml が行う)
name = "run-log"
pages_build_output_dir = "web"
compatibility_date = "2026-09-01"

[vars]
# scripts/gen_vapid.py で作った公開鍵 (公開してよい値)。README の初回セットアップ 3 で貼る
VAPID_PUBLIC_KEY = ""

[[d1_databases]]
binding = "DB"
database_name = "run-log"
# Cloudflare の D1 で作ったデータベース run-log の ID
database_id = "2c7ddbe5-2385-4dca-bc5f-736e82824ddf"
migrations_dir = "migrations"
